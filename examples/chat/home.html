<!DOCTYPE html>
<html lang="en">
<head>
<title>Chat Example</title>
<script type="text/javascript">
window.onload = function () {
    var conn;
    var msg = document.getElementById("msg");
    var log = document.getElementById("log");
    var name = window.prompt("Please enter your name:", "Anonymous") || "Anonymous";
    function appendLog(item) {
        var doScroll = log.scrollTop > log.scrollHeight - log.clientHeight - 1;
        log.appendChild(item);
        if (doScroll) {
            log.scrollTop = log.scrollHeight - log.clientHeight;
        }
    }

    document.getElementById("form").onsubmit = function () {
        if (!conn) {
            return false;
        }
        if (!msg.value) {
            return false;
        }
        conn.send(msg.value);
        msg.value = "";
        return false;
    };

    if (window["WebSocket"]) {
        conn = new WebSocket("ws://" + document.location.host + "/ws?name=" + encodeURIComponent(name));
        conn.onclose = function (evt) {
            var item = document.createElement("div");
            item.innerHTML = "<b>Connection closed.</b>";
            appendLog(item);
        };
        conn.onmessage = function (evt) {
            var messages = evt.data.split('\n');
            for (var i = 0; i < messages.length; i++) {
                if (!messages[i]) continue;
                var item = document.createElement("div");

                try {
                    // === 嘗試解析後端傳來的 Message JSON ===
                    var parsed = JSON.parse(messages[i]);
                    var sender = parsed.sender_id || "Anonymous";
                    var source = parsed.source_gateway ? " @ " + parsed.source_gateway : "";
                    var payload = parsed.payload || "";

                    item.className = (sender === name) ? "message mine" : "message theirs";
                    item.innerText = "[" + sender + source + "]: " + payload;
                } catch (e) {
                    // === 若非 JSON 格式則走原本的純文字邏輯 ===
                    item.className = messages[i].startsWith(name + ": ") ? "message mine" : "message theirs";
                    item.innerText = messages[i];
                }

                appendLog(item);
            }
        };
    } else {
        var item = document.createElement("div");
        item.innerHTML = "<b>Your browser does not support WebSockets.</b>";
        appendLog(item);
    }
};
</script>
<style type="text/css">
html {
    overflow: hidden;
}

body {
    overflow: hidden;
    padding: 0;
    margin: 0;
    width: 100%;
    height: 100%;
    background: gray;
}

#log {
    background: white;
    margin: 0;
    padding: 0.5em 0.5em 0.5em 0.5em;
    position: absolute;
    top: 0.5em;
    left: 0.5em;
    right: 0.5em;
    bottom: 3em;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 0.5em;
}

.message {
    border-radius: 0.75em;
    max-width: 70%;
    padding: 0.5em 0.75em;
    overflow-wrap: anywhere;
}

.message.mine {
    align-self: flex-end;
    background: #d9fdd3;
}

.message.theirs {
    align-self: flex-start;
    background: #eeeeee;
}

#form {
    padding: 0 0.5em 0 0.5em;
    margin: 0;
    position: absolute;
    bottom: 1em;
    left: 0px;
    width: 100%;
    overflow: hidden;
}

</style>
</head>
<body>
<div id="log"></div>
<form id="form">
    <input type="submit" value="Send" />
    <input type="text" id="msg" size="64" autofocus />
</form>
</body>
</html>
